# ResNet-18 / CIFAR-10 — reduced for memory
# 11M params × 200 steps × 3 tensors ≈ 25GB — tight but feasible
model:
  type: resnet18
  dataset: cifar10
  num_classes: 10

optimizer:
  type: adam
  lr: 0.001
  beta1: 0.9
  beta2: 0.999
  eps: 1.0e-8

training:
  T: 200
  batch_size: 32
  seed: 42
  deterministic: true

rewrites:
  rewrite_times: [0.25, 0.5, 0.75]
  ema_alpha: 0.999
  lora_freeze_frac: 0.3
  checkpoint_staleness: 30

lipschitz:
  n_samples: 3
  eps: 1.0e-4
  sample_every: 50

delta_scaling:
  scales: [0.001, 0.005, 0.01, 0.05, 0.1]