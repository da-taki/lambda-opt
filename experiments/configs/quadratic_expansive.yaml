# Expansive regime: L_pred > 1
# Large LR relative to curvature → optimizer AMPLIFIES perturbations
# This is the SEPARATION EXAMPLE: bound correctly predicts failure
# Expected: divergence grows after rewrite, bound catches it
model:
  type: quadratic
  n: 10
  condition_number: 100

optimizer:
  type: adam
  lr: 0.05
  beta1: 0.9
  beta2: 0.999
  eps: 1.0e-8

training:
  T: 200
  seed: 42

rewrites:
  rewrite_times: [0.25, 0.5, 0.75]
  ema_alpha: 0.999
  lora_freeze_frac: 0.5
  checkpoint_staleness: 30

lipschitz:
  n_samples: 10
  eps: 1.0e-4
  sample_every: 5

delta_scaling:
  scales: [0.001, 0.002, 0.005, 0.01, 0.02, 0.05, 0.1]